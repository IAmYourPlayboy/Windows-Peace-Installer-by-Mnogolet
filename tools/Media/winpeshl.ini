; Чем WinPE занимается сразу после загрузки.
;
; Без этого файла образ запускает установщик Windows. С ним - наш мастер.
; wpeinit нужен и остаётся отдельной строкой: он поднимает устройства, без него
; дисков может не оказаться вовсе. Это проверенная структура самозапуска.
;
; Запуск идёт через cmd.exe, а не файлом .cmd напрямую: winpeshl запускает
; приложения, а командный файл приложением не является - его исполняет
; командная оболочка.
[LaunchApps]
%SYSTEMROOT%\System32\wpeinit.exe
%SYSTEMROOT%\System32\cmd.exe, /c %SYSTEMROOT%\System32\peace-launch.cmd